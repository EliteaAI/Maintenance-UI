name: Build and release from tag

on:
  push:
    tags: [ '*' ]

  workflow_dispatch:
    inputs:
      tag:
        default: "latest"
        description: "Release tag"
        required: true
      runner:
        type: choice
        description: "Action runs on"
        options:
          - self-hosted
          - ubuntu-latest
        required: true

jobs:
  build_and_release:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 23.11.0

      - name: Install dependencies
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm install

      - name: Build project
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npm run build -- --base=./
          mv ./dist/index.html ./dist/maintenance.html

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./dist/maintenance.html
          makeLatest: false
          allowUpdates: true
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
